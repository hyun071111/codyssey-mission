<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 티어리스트 (Movie Tier List)</title>
    <style>
        :root {
            --bg-color: #1a1a24;
            --card-bg: #262636;
            --text-color: #f0f0f5;
            --accent-color: #e50914;
            --border-color: #3f3f5a;

            /* Tier Colors */
            --tier-s: #ff7f7f;
            --tier-a: #ffbf7f;
            --tier-b: #ffff7f;
            --tier-c: #7fff7f;
            --tier-d: #7fbfff;
            --tier-f: #bf7fff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            line-height: 1.5;
        }

        header {
            max-width: 1100px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        h1 {
            font-size: 1.8rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background-color: #3b3b54;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #4f4f70;
        }

        .btn-primary {
            background-color: var(--accent-color);
        }

        .btn-primary:hover {
            background-color: #b20710;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.8rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Controls Area */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 12px 20px;
            border-radius: 8px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        /* Tier Board */
        .tier-board {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: #121218;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .tier-row {
            display: flex;
            min-height: 110px;
            background-color: #1e1e2d;
            border-radius: 4px;
            overflow: hidden;
        }

        .tier-label {
            width: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 900;
            color: #111;
            flex-shrink: 0;
        }

        .tier-s {
            background-color: var(--tier-s);
        }

        .tier-a {
            background-color: var(--tier-a);
        }

        .tier-b {
            background-color: var(--tier-b);
        }

        .tier-c {
            background-color: var(--tier-c);
        }

        .tier-d {
            background-color: var(--tier-d);
        }

        .tier-f {
            background-color: var(--tier-f);
        }

        .tier-content {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            align-items: center;
            min-height: 110px;
            transition: background-color 0.2s ease;
        }

        .tier-content.drag-over {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Unassigned Pool */
        .pool-section {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .pool-header {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .movie-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 120px;
            padding: 10px;
            background-color: #181824;
            border-radius: 6px;
            border: 2px dashed #34344d;
        }

        /* Movie Item Card */
        .movie-card {
            width: 75px;
            height: 105px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            cursor: grab;
            background-color: #333;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            flex-shrink: 0;
        }

        .movie-card:active {
            cursor: grabbing;
        }

        .movie-card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .movie-title-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 5px;
            font-size: 0.75rem;
            font-weight: bold;
            background-color: #2b2b3d;
            color: #ddd;
            word-break: keep-all;
        }

        .movie-card .overlay-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }

        /* Modal Styles */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background-color: var(--card-bg);
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 1.3rem;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #aaa;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: #1a1a24;
            color: #fff;
            font-size: 0.95rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .status-msg {
            font-size: 0.85rem;
            color: #4cd964;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎬 영화 티어리스트</h1>
    </header>

    <div class="container">
        <!-- 액션 바 -->
        <div class="action-bar">
            <div>
                <span class="status-msg" id="saveStatus"></span>
            </div>
            <div class="action-buttons">
                <button class="btn" id="openAddMovieModalBtn">+ 직접 영화 등록</button>
                <button class="btn btn-primary" id="saveBtn">💾 기록 저장</button>
                <button class="btn" id="resetBtn">🔄 초기화</button>
            </div>
        </div>

        <!-- 티어 구역 (S ~ F) -->
        <div class="tier-board" id="tierBoard">
            <div class="tier-row" data-tier="S">
                <div class="tier-label tier-s">S</div>
                <div class="tier-content" id="tier-S"></div>
            </div>
            <div class="tier-row" data-tier="A">
                <div class="tier-label tier-a">A</div>
                <div class="tier-content" id="tier-A"></div>
            </div>
            <div class="tier-row" data-tier="B">
                <div class="tier-label tier-b">B</div>
                <div class="tier-content" id="tier-B"></div>
            </div>
            <div class="tier-row" data-tier="C">
                <div class="tier-label tier-c">C</div>
                <div class="tier-content" id="tier-C"></div>
            </div>
            <div class="tier-row" data-tier="D">
                <div class="tier-label tier-d">D</div>
                <div class="tier-content" id="tier-D"></div>
            </div>
            <div class="tier-row" data-tier="F">
                <div class="tier-label tier-f">F</div>
                <div class="tier-content" id="tier-F"></div>
            </div>
        </div>

        <!-- 미배치 영화 풀 -->
        <div class="pool-section">
            <div class="pool-header">
                <span>📌 미배치 영화 목록</span>
                <span style="font-size: 0.8rem; color: #888; font-weight: normal;">포스터를 드래그하여 위 티어 칸에 배치하세요</span>
            </div>
            <div class="movie-pool tier-content" id="tier-unassigned">
                <!-- 미배치 영화 카드가 렌더링됨 -->
            </div>
        </div>
    </div>

    <!-- 영화 직접 등록 모달 -->
    <div class="modal-backdrop" id="addMovieModal">
        <div class="modal">
            <h2 class="modal-title">새 영화 등록</h2>
            <div class="form-group">
                <label for="movieTitleInput">영화 제목</label>
                <input type="text" id="movieTitleInput" placeholder="예: 인셉션">
            </div>
            <div class="form-group">
                <label for="moviePosterInput">포스터 이미지 URL (선택)</label>
                <input type="url" id="moviePosterInput" placeholder="https://example.com/poster.jpg">
            </div>
            <div class="modal-actions">
                <button class="btn" id="closeAddMovieModalBtn">취소</button>
                <button class="btn btn-primary" id="submitAddMovieBtn">등록</button>
            </div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // 1. 초기 데이터 정의 (기획서 8종 기본 영화)
        // -------------------------------------------------------------
        const DEFAULT_MOVIES = [
            { id: 'm1', title: '기생충', poster: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=200&auto=format&fit=crop&q=60' },
            { id: 'm2', title: '인터스텔라', poster: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=200&auto=format&fit=crop&q=60' },
            { id: 'm3', title: '라라랜드', poster: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=200&auto=format&fit=crop&q=60' },
            { id: 'm4', title: '센과 치히로의 행방불명', poster: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=200&auto=format&fit=crop&q=60' },
            { id: 'm5', title: '어벤져스: 엔드게임', poster: 'https://images.unsplash.com/photo-1635863138275-d9b33299680b?w=200&auto=format&fit=crop&q=60' },
            { id: 'm6', title: '범죄도시', poster: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=200&auto=format&fit=crop&q=60' },
            { id: 'm7', title: '타이타닉', poster: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=200&auto=format&fit=crop&q=60' },
            { id: 'm8', title: '토이 스토리', poster: 'https://images.unsplash.com/photo-1566577739112-5180d4bf9390?w=200&auto=format&fit=crop&q=60' }
        ];

        // -------------------------------------------------------------
        // 2. 애플리케이션 상태 관리
        // -------------------------------------------------------------
        let state = {
            movies: [],        // 사용 가능한 전체 영화 리스트
            assignments: {}    // { movieId: tierName } ('S', 'A', 'B', 'C', 'D', 'F', 또는 'unassigned')
        };

        // -------------------------------------------------------------
        // 3. 로컬 저장소 연동 및 데이터 초기화
        // -------------------------------------------------------------
        function initApp() {
            loadUserData();
            renderTierBoard();
            setupDragAndDrop();
        }

        function loadUserData() {
            // 영화 목록 (기본 + 사용자 추가)
            const savedMovies = localStorage.getItem('movie_tier_movies');
            if (savedMovies) {
                state.movies = JSON.parse(savedMovies);
            } else {
                state.movies = [...DEFAULT_MOVIES];
                localStorage.setItem('movie_tier_movies', JSON.stringify(state.movies));
            }

            // 티어 배치 정보 읽기
            const storageKey = 'movie_tier_assign_guest';

            const savedAssignments = localStorage.getItem(storageKey);
            if (savedAssignments) {
                state.assignments = JSON.parse(savedAssignments);
            } else {
                state.assignments = {};
                state.movies.forEach(m => {
                    state.assignments[m.id] = 'unassigned';
                });
            }
        }

        function saveData(showFeedback = true) {
            const storageKey = 'movie_tier_assign_guest';

            localStorage.setItem(storageKey, JSON.stringify(state.assignments));
            localStorage.setItem('movie_tier_movies', JSON.stringify(state.movies));

            if (showFeedback) {
                const statusEl = document.getElementById('saveStatus');
                statusEl.textContent = '✓ 저장되었습니다.';
                setTimeout(() => { statusEl.textContent = ''; }, 2500);
            }
        }

        // -------------------------------------------------------------
        // 4. UI 렌더링 함수
        // -------------------------------------------------------------
        function renderTierBoard() {
            // 모든 구역 비우기
            const tiers = ['S', 'A', 'B', 'C', 'D', 'F', 'unassigned'];
            tiers.forEach(t => {
                const el = document.getElementById(`tier-${t}`);
                if (el) el.innerHTML = '';
            });

            // 영화 카드 배치
            state.movies.forEach(movie => {
                const tier = state.assignments[movie.id] || 'unassigned';
                const targetEl = document.getElementById(`tier-${tier}`);
                if (targetEl) {
                    const card = createMovieCard(movie);
                    targetEl.appendChild(card);
                }
            });
        }

        function createMovieCard(movie) {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.setAttribute('draggable', 'true');
            card.setAttribute('data-id', movie.id);

            // 이미지 로드 에러 처리
            const img = document.createElement('img');
            img.src = movie.poster;
            img.alt = movie.title;
            img.onerror = () => {
                img.style.display = 'none';
                const fallback = document.createElement('div');
                fallback.className = 'movie-title-fallback';
                fallback.textContent = movie.title;
                card.appendChild(fallback);
            };

            const overlay = document.createElement('div');
            overlay.className = 'overlay-title';
            overlay.textContent = movie.title;

            card.appendChild(img);
            card.appendChild(overlay);

            // 드래그 이벤트 바인딩
            card.addEventListener('dragstart', handleDragStart);
            card.addEventListener('dragend', handleDragEnd);

            return card;
        }

        // -------------------------------------------------------------
        // 5. 드래그 앤 드롭 구현
        // -------------------------------------------------------------
        let draggedCardId = null;

        function handleDragStart(e) {
            draggedCardId = this.getAttribute('data-id');
            e.dataTransfer.setData('text/plain', draggedCardId);
            this.style.opacity = '0.4';
        }

        function handleDragEnd(e) {
            this.style.opacity = '1';
            draggedCardId = null;
        }

        function setupDragAndDrop() {
            const dropContainers = document.querySelectorAll('.tier-content');

            dropContainers.forEach(container => {
                container.addEventListener('dragover', e => {
                    e.preventDefault();
                    container.classList.add('drag-over');
                });

                container.addEventListener('dragleave', e => {
                    container.classList.remove('drag-over');
                });

                container.addEventListener('drop', e => {
                    e.preventDefault();
                    container.classList.remove('drag-over');

                    const movieId = e.dataTransfer.getData('text/plain') || draggedCardId;
                    if (!movieId) return;

                    // 구역 구하기 (tier-S -> S, tier-unassigned -> unassigned)
                    const containerId = container.id;
                    const tier = containerId.replace('tier-', '');

                    // 상태 업데이트
                    state.assignments[movieId] = tier;

                    // DOM 이동
                    const card = document.querySelector(`.movie-card[data-id="${movieId}"]`);
                    if (card) {
                        container.appendChild(card);
                    }
                });
            });
        }

        // -------------------------------------------------------------
        // 6. 이벤트 리스너 및 사용자 동작 처리
        // -------------------------------------------------------------
        document.getElementById('saveBtn').addEventListener('click', () => {
            saveData(true);
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('모든 영화 배치를 미배치 상태로 초기화하시겠습니까?')) {
                state.movies.forEach(m => {
                    state.assignments[m.id] = 'unassigned';
                });
                renderTierBoard();
                saveData(false);
            }
        });

        // 영화 직접 등록
        document.getElementById('openAddMovieModalBtn').addEventListener('click', () => openModal('addMovieModal'));
        document.getElementById('closeAddMovieModalBtn').addEventListener('click', () => closeModal('addMovieModal'));

        document.getElementById('submitAddMovieBtn').addEventListener('click', () => {
            const titleInput = document.getElementById('movieTitleInput');
            const posterInput = document.getElementById('moviePosterInput');

            const title = titleInput.value.trim();
            if (!title) {
                alert('영화 제목을 입력해 주세요.');
                return;
            }

            const newMovie = {
                id: 'custom_' + Date.now(),
                title: title,
                poster: posterInput.value.trim() || 'https://via.placeholder.com/200x300?text=' + encodeURIComponent(title)
            };

            state.movies.push(newMovie);
            state.assignments[newMovie.id] = 'unassigned';

            saveData(false);
            renderTierBoard();

            titleInput.value = '';
            posterInput.value = '';
            closeModal('addMovieModal');
        });

        // -------------------------------------------------------------
        // 7. 유틸리티 함수 (모달)
        // -------------------------------------------------------------
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // 초기 실행
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>

</html>
