<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>내 영화 티어리스트</title>
    <style>
        :root {
            --bg: #f6f5f2;
            --surface: #fff;
            --text: #1d1d1f;
            --muted: #6b6b70;
            --line: #dcdad4;
            --accent: #3b5bdb;
            --S: #ff7f7f;
            --A: #ffbf7f;
            --B: #ffdf7f;
            --C: #bfff7f;
            --D: #7fbfff;
            --F: #bf7fff;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #17171a;
                --surface: #222226;
                --text: #f2f2f4;
                --muted: #9a9aa2;
                --line: #3a3a40;
                --accent: #7c9bff;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #17171a;
            --surface: #222226;
            --text: #f2f2f4;
            --muted: #9a9aa2;
            --line: #3a3a40;
            --accent: #7c9bff;
            color-scheme: dark
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
            line-height: 1.4
        }

        main {
            max-width: 860px;
            margin: 0 auto;
            padding: 20px 14px 40px
        }

        h1 {
            font-size: 22px;
            margin: 0 0 4px
        }

        .sub {
            color: var(--muted);
            font-size: 13px;
            margin: 0 0 16px
        }

        .tier {
            display: flex;
            border: 1px solid var(--line);
            border-radius: 10px;
            margin-bottom: 6px;
            overflow: hidden;
            background: var(--surface)
        }

        .label {
            width: 64px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            color: #222
        }

        .zone {
            flex: 1;
            min-height: 136px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 6px;
            align-content: flex-start
        }

        .zone.over {
            outline: 2px dashed var(--accent);
            outline-offset: -4px
        }

        .card {
            position: relative;
            width: 84px;
            height: 120px;
            border-radius: 6px;
            overflow: hidden;
            cursor: grab;
            color: #fff;
            display: flex;
            align-items: flex-end;
            font-size: 12px;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
            user-select: none;
            -webkit-user-select: none
        }

        .card img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .card span {
            position: relative;
            padding: 6px;
            width: 100%;
            background: linear-gradient(transparent, rgba(0, 0, 0, .65))
        }

        .card.sel {
            outline: 3px solid var(--accent)
        }

        .card.drag {
            opacity: .4
        }

        .del {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 20px;
            height: 20px;
            border: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, .6);
            color: #fff;
            font-size: 12px;
            line-height: 20px;
            padding: 0;
            cursor: pointer;
            z-index: 2
        }

        h2 {
            font-size: 15px;
            margin: 20px 0 6px
        }

        .pool {
            border: 1px dashed var(--line);
            border-radius: 10px;
            background: var(--surface)
        }

        .add {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 16px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface)
        }

        input[type=text] {
            flex: 1;
            min-width: 140px;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font: inherit
        }

        input[type=file] {
            font-size: 12px;
            max-width: 190px
        }

        button.b {
            padding: 8px 14px;
            border: 0;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            cursor: pointer
        }

        button.g {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--line)
        }

        .bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            font-size: 12px;
            color: var(--muted)
        }
    </style>
</head>

<body>
    <main>
        <h1>🎬 내 영화 티어리스트</h1>
        <p class="sub">포스터를 티어 칸으로 끌어다 놓으세요. 모바일에서는 포스터를 탭한 뒤 칸을 탭하면 됩니다. 변경 내용은 이 브라우저에 자동 저장됩니다.</p>
        <div id="tiers"></div>
        <h2>미배치 영화</h2>
        <div class="pool zone" id="pool" data-tier=""></div>
        <div class="add">
            <input type="text" id="title" placeholder="영화 제목" maxlength="40">
            <input type="file" id="file" accept="image/*">
            <button class="b" id="addBtn">영화 추가</button>
        </div>
        <div class="bar"><span id="msg">자동 저장됨</span><button class="b g" id="reset">초기화</button></div>
    </main>
    <script>
        const TIERS = ["S", "A", "B", "C", "D", "F"];
        const BASE = ["기생충", "인터스텔라", "라라랜드", "센과 치히로의 행방불명", "어벤져스: 엔드게임", "범죄도시", "타이타닉", "토이 스토리"]
            .map((t, i) => ({ id: "m" + i, title: t, tier: "", img: "", custom: false }));
        const KEY = "movie-tierlist-v1";
        let movies = load(), sel = null;
        function load() { try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s) } catch (e) { } return JSON.parse(JSON.stringify(BASE)) }
        function save() { try { localStorage.setItem(KEY, JSON.stringify(movies)); msg("자동 저장됨") } catch (e) { msg("저장 공간이 부족하거나 사용할 수 없습니다") } }
        function msg(t) { document.getElementById("msg").textContent = t }
        function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h }
        function card(m) {
            const d = document.createElement("div"); d.className = "card" + (sel === m.id ? " sel" : ""); d.draggable = true; d.dataset.id = m.id;
            if (m.img) { const i = document.createElement("img"); i.src = m.img; i.alt = ""; d.appendChild(i) }
            else d.style.background = `linear-gradient(160deg,hsl(${hue(m.title)},55%,45%),hsl(${(hue(m.title) + 50) % 360},60%,30%))`;
            const s = document.createElement("span"); s.textContent = m.title; d.appendChild(s);
            if (m.custom) {
                const x = document.createElement("button"); x.className = "del"; x.textContent = "×"; x.title = "삭제";
                x.onclick = e => { e.stopPropagation(); movies = movies.filter(a => a.id !== m.id); save(); render() }; d.appendChild(x)
            }
            d.ondragstart = e => { e.dataTransfer.setData("text/plain", m.id); d.classList.add("drag") };
            d.ondragend = () => d.classList.remove("drag");
            d.onclick = () => { sel = sel === m.id ? null : m.id; render() };
            return d
        }
        function move(id, tier) { const m = movies.find(a => a.id === id); if (!m) return; m.tier = tier; movies = movies.filter(a => a !== m); movies.push(m); sel = null; save(); render() }
        function wire(z) {
            z.ondragover = e => { e.preventDefault(); z.classList.add("over") };
            z.ondragleave = () => z.classList.remove("over");
            z.ondrop = e => { e.preventDefault(); z.classList.remove("over"); move(e.dataTransfer.getData("text/plain"), z.dataset.tier) };
            z.onclick = e => { if (sel && e.target === z) move(sel, z.dataset.tier) }
        }
        function render() {
            const t = document.getElementById("tiers"); t.innerHTML = "";
            TIERS.forEach(k => {
                const r = document.createElement("div"); r.className = "tier";
                r.innerHTML = `<div class="label" style="background:var(--${k})">${k}</div>`;
                const z = document.createElement("div"); z.className = "zone"; z.dataset.tier = k; wire(z);
                movies.filter(m => m.tier === k).forEach(m => z.appendChild(card(m)));
                r.appendChild(z); t.appendChild(r)
            });
            const p = document.getElementById("pool"); p.innerHTML = ""; wire(p);
            movies.filter(m => !m.tier).forEach(m => p.appendChild(card(m)))
        }
        document.getElementById("addBtn").onclick = () => {
            const ti = document.getElementById("title"), f = document.getElementById("file").files[0], name = ti.value.trim();
            if (!name) { msg("영화 제목을 입력해 주세요"); return }
            const push = img => { movies.push({ id: "c" + Date.now(), title: name, tier: "", img, custom: true }); ti.value = ""; document.getElementById("file").value = ""; save(); render() };
            if (f) {
                if (f.size > 1.5e6) { msg("이미지는 1.5MB 이하만 가능합니다"); return }
                const r = new FileReader(); r.onload = () => push(r.result); r.readAsDataURL(f)
            } else push("")
        };
        document.getElementById("reset").onclick = () => { if (confirm("모든 기록을 초기화할까요?")) { movies = JSON.parse(JSON.stringify(BASE)); sel = null; save(); render() } };
        render();
    </script>
</body>

</html>
